name: Testing CI
on:
  push:
  pull_request:
    branches:
    - main

jobs:
  test-exercises:
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2022]

    name: Check exercises (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Install Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      with:
        version: 0.17.0

    - name: Test exercises
      shell: bash
      run: ./bin/run-tests

  tests:
    name: Tests
    needs: test-exercises
    if: always()
    runs-on: ubuntu-26.04
    steps:
    - name: Check that every configuration passed
      env:
        RESULT: ${{ needs.test-exercises.result }}
      run: |
        if [[ "$RESULT" != "success" ]]; then
          echo "The exercise tests failed on at least one configuration."
          exit 1
        fi
